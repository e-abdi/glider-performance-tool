on:
  push:
    branches: main

name: Render and Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # Publishing pushes the rendered site to the gh-pages branch; new repositories give
    # workflows read-only access by default, so ask for write access here.
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # kasey_testDashboard.qmd has {r} chunks, so the whole site fails to render
      # without R. use-public-rspm pulls Linux binaries from Posit Package Manager;
      # building bslib and shiny from source takes minutes instead of seconds.
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # knitr is what Quarto's R engine runs the chunks with; bslib and shiny are
      # what kasey_testDashboard.qmd calls. A fresh runner has none of them.
      - name: Install R packages used by the pages
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown", "bslib", "shiny"))'

      # Rebuild the endurance page from content/data/extra-sensors.csv, so adding a
      # sensor is a one-line edit on GitHub with nothing to run locally. This reads only
      # files that are in the repo - the workbook itself is not needed here.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install Python packages used by the pages
        run: python -m pip install -r requirements.txt

      - name: Rebuild the endurance page
        run: python3 code/build_endurance_page.py

      - name: Check the sensor list still matches the workbook
        run: node code/check_extra_sensors.js && node code/check_endurance_model.js

      # The Seaglider model is fitted to our own dive logs; re-run it against all of them so a
      # refit that no longer reproduces a mission cannot publish.
      - name: Check the Seaglider endurance model against the logged dives
        run: node code/build_seaglider_page.js --check

      - name: Publish to GitHub Pages (and render)
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # this secret is always available for github actions
